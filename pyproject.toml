[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqo-manager"
version = "0.7.0"
description = "Mordomo digital local-first para reduzir carga cognitiva."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["colorama>=0.4.6"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
eqo = "eqo.cli.interface:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["eqo"]
